# Toàn Dân Cầu Sinh — chạy bằng Docker Compose
# Yêu cầu: đã cài Docker Desktop

services:
  server:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
